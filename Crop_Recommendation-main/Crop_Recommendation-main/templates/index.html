
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles */
        body { background: #BCBBB8; }
        .container { background: #fffbfe; padding: 20px; border-radius: 15px; }
        .card { margin: 20px auto; color: #f1eff0; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Crop Recommendation System Using Machine Learning</a>
        </div>
    </nav>

    <!-- Main Form Section -->
    <div class="container my-5">
        <h1 class="text-center text-success">Crop Recommendation System 🌱</h1>
        <form action="/predict" method="POST" class="mt-3">
            <!-- Nutrient and Environmental Inputs -->
            <div class="row">
                <div class="col-md-4"><label for="Nitrogen"><b>Nitrogen🍃</b></label><input type="number" id="Nitrogen" name="Nitrogen" class="form-control" required></div>
                <div class="col-md-4"><label for="Phosphorus"><b>Phosphorus🍶</b></label><input type="number" id="Phosphorus" name="Phosporus" class="form-control" required></div>
                <div class="col-md-4"><label for="Potassium"><b>Potassium⚙️</b></label><input type="number" id="Potassium" name="Potassium" class="form-control" required></div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4"><label for="Temperature"><b>Temperature🌡️</b></label></label><input type="number" id="Temperature" name="Temperature" class="form-control" required></div>
                <div class="col-md-4"><label for="Humidity"><b>Humidity💦</b></label><input type="number" id="Humidity" name="Humidity" class="form-control" required></div>
                <div class="col-md-4"><label for="pH"><b>pH🧪</b></label><input type="number" id="pH" name="pH" class="form-control" required></div>
            </div>
            <div class="row mt-3">
                <div class="col-md-4"><label for="Rainfall"><b>Rainfall🌦️</b></label><input type="number" id="Rainfall" name="Rainfall" class="form-control" required></div>
            </div>
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">Get Recommendation</button>
                
            </div>
        </form>

        <!-- Display Recommendation Result -->
        {% if result %}
        <div class="card bg-dark text-white text-center mt-5">
            <div class="card-body">
                <h5 class="card-title">Recommended Crop for Cultivation:</h5>
                <p class="card-text">{{ result }}</p>
                <a href="/crops/{{ result | lower }}.html" class="btn btn-success">More Information on {{ result }}</a>
            </div>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
